{% extends 'main.html' %}

{% block content %}
<div class="container">
    <h2>My Categories</h2>
    
    
    {% if categories %}
        <div class="mb-3">
            <a href="{% url 'addCategory' %}" class="btn btn-primary">
                + Add New Category
            </a>
        </div>
        <div class="row">
            {% for category in categories %}
                <div class="col-md-4 mb-3">
                    <div class="card">
                        <div class="card-body">
                            <div class="d-flex align-items-center">
                                {% if category.icon %}
                                    <img src="{{ category.icon.url }}" alt="{{ category.name }}" 
                                        style="width: 50px; height: 50px; margin-right: 15px;">
                                {% endif %}
                                <h5 class="card-title mb-0">{{ category.name }}</h5>
                            </div>
                            
                            <div class="mt-3">
                                <a href="{% url 'edit_category' category.id %}" class="btn btn-sm btn-warning">
                                    Edit
                                </a>
                                <a href="{% url 'delete_category' category.id %}" class="btn btn-sm btn-danger">
                                    Delete
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            {% endfor %}
        </div>
    {% else %}
        <div class="alert alert-info">
            No categories yet. <a href="{% url 'addCategory' %}">Create your first category</a>
        </div>
    {% endif %}
</div>
{% endblock %}
